<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sky Havoc 3D: สายการบินมรณะ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Sarabun',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;position:fixed;width:100%}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#view{flex:0 0 56%;position:relative;overflow:hidden}
#cv{width:100%;height:100%;display:block}
#ctrl{flex:1;display:flex;align-items:center;justify-content:space-around;background:#0b1a2b;padding-bottom:env(safe-area-inset-bottom)}
#joy{width:140px;height:140px;border-radius:50%;background:#ffffff22;border:2px solid #fff6;position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffffbb}
#btns{display:grid;grid-template-columns:repeat(2,96px);gap:8px}
#btns button{height:68px;border-radius:14px;background:#d9480fcc;color:#fff;border:2px solid #fff6;font:700 11px 'Sarabun',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
#btns button:active{background:#ffa94d;transform:scale(.95)}
#btns b{font-size:24px;line-height:1}
#hud{position:absolute;left:6px;top:calc(6px + env(safe-area-inset-top));width:min(46%,230px);pointer-events:none}
.b{position:relative;height:15px;background:#000a;border-radius:8px;overflow:hidden;font-size:11px;margin:2px 0;line-height:15px}
.b i{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
.b span{position:relative;z-index:1;padding-left:6px;text-shadow:0 0 3px #000}
.m{font-size:11px;background:#000a;border-radius:6px;padding:2px 6px;margin:2px 0}
.w{font-size:13px;font-weight:800;background:#c1121fdd;border-radius:6px;padding:3px 6px;margin:2px 0;animation:bl .5s infinite alternate}
@keyframes bl{to{opacity:.45}}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#000c;border:1px solid #ffd43b;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;max-width:90%;text-align:center;pointer-events:none}
#bubble{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#fff;color:#111;border-radius:14px;padding:6px 12px;font-size:14px;font-weight:700;max-width:80%;text-align:center;display:none;pointer-events:none}
#ov{position:absolute;inset:0;z-index:9;background:linear-gradient(#071428f2,#173b5ff2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;overflow:auto}
#ov h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.5px}
#ov h2{margin:0;font-size:22px}
#ov p{margin:4px 0;font-size:15px}
#ov small{opacity:.75;max-width:340px}
#ov button{font:800 17px 'Sarabun',sans-serif;padding:12px 22px;border-radius:12px;border:0;background:#f76707;color:#fff;min-width:200px;cursor:pointer}
#ov button.alt{background:#364fc7}
#ov input{font:700 18px 'Sarabun',sans-serif;padding:11px;border-radius:12px;border:0;width:130px;text-align:center}
.row{display:flex;gap:8px;align-items:center;justify-content:center}.row button{min-width:0!important}
.big{font-size:64px;font-weight:800;letter-spacing:8px;color:#ffd43b}
.card{background:#ffffff18;border:1px solid #fff5;border-radius:12px;padding:10px;width:min(92%,420px);font-size:14px;margin:4px auto;cursor:pointer}
.card:active{background:#ffffff40}
#ov{touch-action:pan-y}
#btns button.sw{grid-column:span 2;height:44px;background:#364fc7cc;flex-direction:row;gap:6px}
#btns button.sw b{font-size:16px}
#pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:12;display:none;background:#0b1a2bf5;border:2px solid #ffd43b;border-radius:14px;padding:14px;text-align:center;width:min(86%,320px);font-size:16px;font-weight:700}
#pop .row{justify-content:center;margin-top:10px}
#pop button{font:800 16px 'Sarabun',sans-serif;padding:10px 18px;border-radius:10px;border:0;color:#fff;background:#2f9e44}
#pop button.no{background:#c92a2a}
@media (orientation:landscape){
 #view{position:absolute;inset:0;flex:none}
 #ctrl{position:absolute;inset:0;background:none;pointer-events:none}
 #joy{position:absolute;left:calc(4vw + env(safe-area-inset-left));bottom:5vh;pointer-events:auto}
 #btns{position:absolute;right:calc(4vw + env(safe-area-inset-right));bottom:5vh;pointer-events:auto}
 #toast{bottom:auto;top:8px}#bubble{bottom:auto;top:46px}
 #hud{width:min(30%,230px)}
 #btns button{height:54px}#btns button.sw{height:40px}
}

<script>

{n:'ไฟลต์ธรรมดา กรุงเทพ → เชียงใหม่',tag:'งานง่าย • ฟ้าใส • ผู้โดยสารใจเย็น',st:1,dist:3000,rw:2000,turb:.12,fail:.04,ang:.5,obs:.6},
{n:'สินค้าด่วนข้ามคืน',tag:'ปานกลาง • ลมแรง • เครื่องยนต์ร้อนบ่อย',st:2,dist:4500,rw:5500,turb:.35,fail:.1,ang:1,obs:1},
{n:'VIP: รัฐมนตรีอารมณ์ร้อน',tag:'ยาก • ผู้โดยสารหัวร้อนมาก',st:3,dist:5000,rw:12000,turb:.6,fail:.16,ang:1.8,obs:1.2},
{n:'สารเคมีอันตราย + พายุคลั่ง',tag:'นรก • เครื่องยนต์ไหม้ • แรงสั่นสะเทือนหนัก',st:4,dist:6000,rw:22000,turb:.9,fail:.3,ang:2.2,obs:1.6}];
let mode='',view='pilot',peer=null,conn=null,G=null,money=0,joy={x:0,y:0},keys={},cr={x:0,z:-1},inp={x:0,y:0},running=false,last=0,hudT=0,inT=0,tt,rin={x:0,y:0},shk=0,V=[],vp={x:0,y:40,z:0},pend=false,swN=0,AC=null,pT,pT2;

function aud(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

function snd(){try{if(!AC)return;const n=Math.floor(AC.sampleRate*.7),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=420;g.gain.value=.9;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}

/* ---------- MENU & NETWORK ---------- */
function menu(){scr(`<h1>✈️ Sky Havoc 3D</h1><h2>สายการบินมรณะ</h2><p>💰 เงินสะสม: ${money.toLocaleString()} บาท</p>
<button onclick="hostGame()">สร้างเที่ยวบิน</button>
<div class=row><input id=code type=tel maxlength=4 placeholder="รหัส 4 หลัก"><button onclick="joinGame()">เข้าร่วม</button></div>
<button class=alt onclick="solo()">เล่นคนเดียว (ทดสอบ)</button>
<small>ผู้เล่น 1 = กัปตัน/ช่างเครื่อง: บังคับเครื่องบิน หลบนก พายุ ภูเขา ดับเพลิงเครื่องยนต์<br>ผู้เล่น 2 = ลูกเรือ: เสิร์ฟอาหาร จัดผู้โดยสารนั่งที่ และโยนคนคลั่งออกประตูท้ายเครื่อง<br>🔄 ระหว่างเล่นกดปุ่ม "ขอสลับฝั่ง" เพื่อสลับบทบาทกับเพื่อนได้</small>`)}
function hostGame(){mode='host';view='pilot';const code=String(1000+Math.floor(R()*9000));scr('<h2>กำลังสร้างห้อง...</h2>');
 peer=new Peer('skyhavoc3d-'+code,PC);
 peer.on('error',e=>{if(e.type==='unavailable-id')hostGame();else scr('<h2>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</h2><button onclick="location.reload()">กลับเมนู</button>')});
 peer.on('open',()=>scr(`<h2>รหัสห้องของคุณ</h2><div class=big>${code}</div><p>บอกรหัสนี้ให้เพื่อนที่เป็นลูกเรือ<br>กำลังรอลูกเรือเข้าร่วม...</p>`));
 peer.on('connection',c=>{conn=c;c.on('open',board);c.on('data',onData);c.on('close',lost)})}
function joinGame(){const code=$('code').value.trim();if(code.length!==4)return toast('กรอกรหัส 4 หลักก่อน');
 mode='crew';view='cabin';scr('<h2>กำลังเชื่อมต่อ...</h2>');
 peer=new Peer(undefined,PC);peer.on('error',fail);
 peer.on('open',()=>{conn=peer.connect('skyhavoc3d-'+code,{reliable:true});
  conn.on('open',()=>scr('<h2>เชื่อมต่อสำเร็จ!</h2><p>รอกัปตันเลือกสัญญาเที่ยวบิน...</p>'));
  conn.on('data',onData);conn.on('close',lost);
  setTimeout(()=>{if(!conn.open)fail()},10000)})}
function fail(){scr('<h2>ไม่พบห้องนี้ หรือเชื่อมต่อไม่ได้</h2><button onclick="location.reload()">กลับเมนู</button>')}
function lost(){if(G&&G.over)return;running=false;scr('<h2>การเชื่อมต่อขาดหาย</h2><button onclick="location.reload()">กลับเมนู</button>')}
function solo(){mode='solo';view='pilot';board()}
function board(){scr('<h2>📋 กระดานสัญญาเที่ยวบิน</h2>'+CON.map((c,i)=>`<div class=card onclick="startContract(${i})"><b>${c.n}</b><br>${'⭐'.repeat(c.st)} ${c.tag}<br>💰 ค่าจ้าง ${c.rw.toLocaleString()} บาท • ระยะ ${c.dist} ม.</div>`).join(''))}
function startContract(i){send({t:'start',c:i});begin(i)}
const PA=['ext','vent','up','dn'];
function onData(m){
 if(m.t==='start')begin(m.c);
 else if(m.t==='s'&&G)Object.assign(G,m.d);
 else if(m.t==='sp'&&G)addO(m.o);
 else if(m.t==='ev'){toast(m.m);if(m.k)fx(m.k)}
 else if(m.t==='end'&&G)finish(m);
 else if(m.t==='in'&&G&&view==='pilot'){cr.x=+m.x||0;cr.z=+m.z||0}
 else if(m.t==='pin'&&G&&view==='cabin'){rin={x:cl(+m.x||0,-1,1),y:cl(+m.y||0,-1,1)}}
 else if(m.t==='act'&&G&&PA.includes(m.a)===(view==='cabin'))hostAct(m.a);
 else if(m.t==='request_swap'&&G&&!G.over)onReq();
 else if(m.t==='swap_ok'&&mode==='host'&&pend&&G&&!G.over)hostSwap();
 else if(m.t==='swap_no'){pend=false;clearTimeout(pT);toast('อีกฝั่งปฏิเสธการสลับฝั่ง')}
 else if(m.t==='swap_do'&&m.n>swN){swN=m.n;pend=false;clearTimeout(pT);doSwap()}}
function askSwap(){if(!G||G.over)return;if(pend)return toast('รอคำตอบอยู่...');pend=true;send({t:'request_swap'});toast('ส่งคำขอสลับฝั่งแล้ว รอการตอบรับ...');clearTimeout(pT);pT=setTimeout(()=>{pend=false},15000)}
function onReq(){if(pend){if(mode==='host')hostSwap();else send({t:'swap_ok'});return}
 const p=$('pop');p.innerHTML='<div>🔄 อีกฝั่งขอสลับบทบาท<br>คุณจะเปลี่ยนเป็น '+(view==='pilot'?'🧑‍✈️ ลูกเรือ':'✈️ กัปตัน')+'</div><div class=row><button onclick="ansSwap(1)">ตกลง</button><button class=no onclick="ansSwap(0)">ปฏิเสธ</button></div>';
 p.style.display='block';clearTimeout(pT2);pT2=setTimeout(()=>ansSwap(0),15000)}
function ansSwap(y){clearTimeout(pT2);$('pop').style.display='none';if(y){if(mode==='host')hostSwap();else send({t:'swap_ok'})}else send({t:'swap_no'})}
function hostSwap(){clearTimeout(pT);pend=false;swN++;send({t:'swap_do',n:swN});doSwap()}
function doSwap(){view=view==='pilot'?'cabin':'pilot';cr={x:0,z:-1};joy.x=joy.y=0;const kn=$('knob');if(kn)kn.style.transform='';inp={x:0,y:0};rin={x:0,y:0};clearTimeout(pT2);$('pop').style.display='none';
 if(G)vp={x:G.px,y:G.py,z:G.pz};setBtns();toast('🔄 สลับบทบาทแล้ว! ตอนนี้คุณคือ'+(view==='pilot'?'✈️ กัปตัน':'🧑‍✈️ ลูกเรือ'),3500)}

/* ---------- THREE.JS WORLD ---------- */
let ren,cam,S1,S2,planeG,engM=[],fireM=[],ground,grid,O=[],paxM=[],crewM;
const mat=c=>new THREE.MeshLambertMaterial({color:c}),M=(g,c)=>new THREE.Mesh(g,mat(c));
function rs(){if(!ren)return;const v=$('view'),w=Math.max(1,v.clientWidth),h=Math.max(1,v.clientHeight);ren.setSize(w,h,false);cam.aspect=w/h;cam.fov=cl(65/Math.pow(cam.aspect,.6),65,95);cam.updateProjectionMatrix()}
function buildWorld(){
 if(!ren){ren=new THREE.WebGLRenderer({canvas:$('cv')});ren.setPixelRatio(Math.min(devicePixelRatio,2));cam=new THREE.PerspectiveCamera(65,1,.1,1500);
  addEventListener('resize',rs);addEventListener('orientationchange',()=>{setTimeout(rs,200);setTimeout(rs,600)});if(window.visualViewport)visualViewport.addEventListener('resize',rs);new ResizeObserver(rs).observe($('view'))}
 O=[];
 S1=new THREE.Scene();S1.background=new THREE.Color(0x8cc4f0);S1.fog=new THREE.Fog(0x8cc4f0,100,420);
 S1.add(new THREE.HemisphereLight(0xffffff,0x446644,.95));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(50,100,50);S1.add(dl);
 ground=M(new THREE.PlaneGeometry(2000,2000),0x3f8a4a);ground.rotation.x=-Math.PI/2;S1.add(ground);
 grid=new THREE.GridHelper(2000,40,0x2d6636,0x2d6636);S1.add(grid);
 planeG=new THREE.Group();
 const fu=M(new THREE.CylinderGeometry(1.2,1,12,10),0xeeeeee);fu.rotation.x=Math.PI/2;planeG.add(fu);
 const nose=M(new THREE.ConeGeometry(1.2,3,10),0xdd3333);nose.rotation.x=-Math.PI/2;nose.position.z=-7.5;planeG.add(nose);
 const wing=M(new THREE.BoxGeometry(16,.25,3),0xcccccc);wing.position.z=-.5;planeG.add(wing);
 const tail=M(new THREE.BoxGeometry(5,.2,2),0xcccccc);tail.position.z=5;planeG.add(tail);
 const fin=M(new THREE.BoxGeometry(.2,3,2),0xdd3333);fin.position.set(0,1.5,5);planeG.add(fin);
 engM=[];fireM=[];
 [-4,4].forEach(x=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,2.5,8),new THREE.MeshBasicMaterial({color:0x44ff44}));e.rotation.x=Math.PI/2;e.position.set(x,-.5,-1.5);planeG.add(e);engM.push(e);
  const f=new THREE.Mesh(new THREE.SphereGeometry(1.1,8,8),new THREE.MeshBasicMaterial({color:0xff6600}));f.position.set(x,.2,1.5);f.visible=false;planeG.add(f);fireM.push(f)});
 S1.add(planeG);
 // cabin
 S2=new THREE.Scene();S2.background=new THREE.Color(0x151d2b);S2.add(new THREE.AmbientLight(0xffffff,.75));
 const pl=new THREE.PointLight(0xffeedd,.9,40);pl.position.set(0,5,0);S2.add(pl);
 const add=(g,c,x,y,z)=>{const m=M(g,c);m.position.set(x,y,z);S2.add(m);return m};
 add(new THREE.BoxGeometry(5,.2,16),0x4a5568,0,-.1,.5);add(new THREE.BoxGeometry(1.2,.22,16),0x8a2b2b,0,-.1,.5);
 add(new THREE.BoxGeometry(.2,3,16),0x9aa8bd,-2.5,1.5,.5);add(new THREE.BoxGeometry(.2,3,16),0x9aa8bd,2.5,1.5,.5);
 add(new THREE.BoxGeometry(5,3,.2),0x9aa8bd,0,1.5,-7.5);add(new THREE.BoxGeometry(5,3,.2),0x9aa8bd,0,1.5,8.2);
 const door=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.4,.3),new THREE.MeshBasicMaterial({color:0xff3b3b}));door.position.set(0,1.2,8);S2.add(door);
 for(let k=0;k<8;k++){add(new THREE.BoxGeometry(1,.6,1),0x2a4d8f,seatX(k),.3,seatZ(k));add(new THREE.BoxGeometry(1,1.1,.2),0x2a4d8f,seatX(k),1,seatZ(k)-.55)}
 crewM=new THREE.Group();crewM.add(Object.assign(M(new THREE.CylinderGeometry(.35,.35,1.1,8),0x1c7ed6),{position:new THREE.Vector3(0,.55,0)}));
 crewM.add(Object.assign(M(new THREE.SphereGeometry(.28,8,8),0xffd8a8),{position:new THREE.Vector3(0,1.4,0)}));
 crewM.add(Object.assign(M(new THREE.CylinderGeometry(.3,.3,.15,8),0x1c7ed6),{position:new THREE.Vector3(0,1.7,0)}));S2.add(crewM);
 paxM=[];const cols=[0xe03131,0x2f9e44,0xf08c00,0x9c36b5,0x0c8599,0xc2255c,0x5c940d,0x495057];
 for(let k=0;k<8;k++){const g=new THREE.Group();
  g.add(Object.assign(M(new THREE.CylinderGeometry(.35,.35,1,8),cols[k]),{position:new THREE.Vector3(0,.5,0)}));
  g.add(Object.assign(M(new THREE.SphereGeometry(.28,8,8),0xffd8a8),{position:new THREE.Vector3(0,1.25,0)}));
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),new THREE.MeshBasicMaterial({color:0xffa500})),{position:new THREE.Vector3(0,1.8,0)}));
  S2.add(g);paxM.push(g)}
 rs()}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let winTex=null;
function wtex(){if(winTex)return winTex;const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#5d6b82';x.fillRect(0,0,64,64);
 for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=(i*7+j*3)%5===0?'#ffe08a':'#1c2b44';x.fillRect(i*16+4,j*16+4,8,10)}
 winTex=new THREE.CanvasTexture(c);winTex.wrapS=winTex.wrapT=THREE.RepeatWrapping;return winTex}
function rmO(o){if(!o||!o.m)return;S1.remove(o.m);o.m.traverse(q=>{if(q.geometry)q.geometry.dispose();if(q.material){if(q.material.map)q.material.map.dispose();q.material.dispose()}})}

function hostAct(a){const g=G;if(!g||g.over)return;
 if(a==='ext'){const i=g.fire[0]?0:g.fire[1]?1:-1;if(i<0)return ev('ไม่มีไฟไหม้ ประหยัดถังไว้ก่อน!');if(g.ext<=0)return ev('ถังดับเพลิงหมดแล้ว!');g.ext--;g.fire[i]=false;g.heat[i]=45;ev(`ดับไฟเครื่องยนต์${N[i]}สำเร็จ! เหลือถัง ${g.ext}`)}
 else if(a==='vent'){if(g.ventCd>0)return ev(`ระบายความร้อนยังไม่พร้อม (${Math.ceil(g.ventCd)} วินาที)`);g.heat=g.heat.map(h=>Math.max(0,h-35));g.ventCd=6;ev('ระบายความร้อนเครื่องยนต์แล้ว ❄️')}

 else if(a==='seat'){const p=near(p=>!p.s);if(!p)return ev('ไม่มีผู้โดยสารที่ยืนอยู่ใกล้ๆ');if(p.a>=80)return ev('คนนี้โมโหเกินไป! ต้องโยนออกประตู');p.s=true;p.a=Math.max(0,p.a-10);ev('จัดผู้โดยสารนั่งและคาดเข็มขัดแล้ว 💺')}
 else if(a==='eject'){if(cr.z<4.5)return ev('ต้องไปที่ประตูท้ายเครื่อง (สีแดง) ก่อน!');const p=near(()=>true,3);if(!p)return ev('ไม่มีผู้โดยสารอยู่ใกล้ประตู');p.e=true;
  if(p.a>=70){g.pen+=6;g.pax.forEach(q=>q.a=Math.max(0,q.a-10));ev('โยนตัวป่วนออกไปแล้ว! ห้องโดยสารสงบลง 🚪')}
  else{g.pen+=18;g.pax.forEach(q=>q.a=Math.min(100,q.a+15));ev('โยนผู้โดยสารที่ไม่ได้ก่อเรื่อง! คนอื่นตื่นตระหนก!')}}}
function sim(dt){const g=G,c=g.c;if(g.over)return;g.t+=dt;
 const sp=45*g.thr;g.trav+=sp*dt;g.pz-=sp*dt;g.prog=g.trav/c.dist;
 const tt=c.turb*(.4+.6*Math.pow(Math.sin(g.t*.2),2))+g.storm*.8;g.turb+=(Math.min(tt,1.2)-g.turb)*dt*2;
 g.px=cl(g.px+(inp.x*40+(R()-.5)*g.turb*60)*dt,-80,80);g.py=cl(g.py+(-inp.y*28+(R()-.5)*g.turb*40)*dt,8,95);
 g.sp+=sp*dt;const gap=75/c.obs;while(g.sp>gap){g.sp-=gap;spawn()}
 let storm=0;g.inv-=dt;
 for(let i=O.length-1;i>=0;i--){const o=O[i];
  if(o.t==='b')o.x=o.x0+Math.sin(g.t*2+o.ph)*8;
  if(o.z>g.pz+40){rmO(o);O.splice(i,1);continue}
  const dx=o.x-g.px,dz=o.z-g.pz;
  if(o.t==='m'){if(Math.abs(dx)<o.r+4&&Math.abs(dz)<o.r+4&&g.py<o.h+2&&g.inv<=0){hit(25,'ชนยอดเขา! ตัวเครื่องเสียหายหนัก!','crash');g.py=o.h+14;g.inv=1.5}}
  else if(o.t==='k'){if(g.inv<=0&&Math.abs(dx)<o.w/2+7&&Math.abs(dz)<o.d/2+5&&g.py-1.5<o.h&&g.py+1.5>0){hit(30,'ชนตึกระฟ้า! ตัวเครื่องเสียหายหนัก! 🏢','crash');let sg=dx>=0?-1:1;if(Math.abs(o.x+sg*(o.w/2+9))>80)sg=-sg;g.px=o.x+sg*(o.w/2+9);g.inv=1.5}}
  else{const d=Math.hypot(dx,o.y-g.py,dz);
   if(o.t==='s'&&d<o.r){storm=1;if(R()<dt*.25)hit(6,'ฟ้าผ่าโดนเครื่อง! ⚡')}
   if(o.t==='b'&&d<o.r&&g.inv<=0){hit(8,'ชนฝูงนก! 🐦');g.heat[R()<.5?0:1]+=45;g.inv=1}}}
 g.storm=storm;
 for(let i=0;i<2;i++){g.heat[i]+=dt*(2.5*g.thr-2);
  if(g.fire[i]){g.hull-=3*dt;g.heat[i]=100}else if(g.heat[i]>=100){g.fire[i]=true;ev(`🔥 เครื่องยนต์${N[i]}ติดไฟ! รีบดับเพลิง!`)}
  g.heat[i]=cl(g.heat[i],0,100)}
 g.evT-=dt;if(g.evT<=0){g.evT=5+R()*7;const i=R()<.5?0:1;g.heat[i]+=18+c.fail*120;ev(`เครื่องยนต์${N[i]}ร้อนผิดปกติ!`)}
 g.ventCd-=dt;
 let sum=0,cnt=0;
 g.pax.forEach((p,k)=>{if(p.e)return;cnt++;
  if(p.w===0){p.nt-=dt;if(p.nt<=0)p.w=1+(R()<.5?0:1)}
  if(p.w)p.a+=.8*c.ang*dt;else p.a-=.8*dt;
  if(!p.s)p.a+=1.5*dt;
  if(g.turb>.45&&p.s&&R()<dt*(g.turb-.3)*.6){p.s=false;p.mt=0;ev('ผู้โดยสารปลดเข็มขัดลุกขึ้นกลางพายุ!')}
  if(p.a>=80&&p.s)p.s=false;
  p.a=cl(p.a,0,100);
  if(p.s){p.x=seatX(k);p.z=seatZ(k);p.dT=0}
  else{p.mt-=dt;const ang=p.a>=80;
   if(ang){p.tx=0;p.tz=6.2}else if(p.mt<=0){p.mt=3;p.tx=(R()-.5)*2.2;p.tz=-5+R()*9}
   const dx=p.tx-p.x,dz=p.tz-p.z,d=Math.hypot(dx,dz)||1,v=Math.min(d,(ang?2.6:1)*dt);p.x+=dx/d*v;p.z+=dz/d*v;
   if(ang&&Math.hypot(p.x,p.z-6.2)<.8){p.dT+=dt;if(p.dT>4){p.dT=0;p.a=45;p.mt=0;hit(15,'ผู้โดยสารเปิดประตูฉุกเฉิน! ตัวเครื่องเสียหาย!')}}else p.dT=0}
  sum+=p.a});
 g.morale=cl(100-(cnt?sum/cnt:0)-g.pen,0,100);
 g.snap-=dt;if(g.snap<=0&&mode==='host'){g.snap=.0155;const r=v=>Math.round(v*100)/100;
  sendF({t:'s',d:{hull:r(g.hull),morale:r(g.morale),prog:r(g.prog),heat:g.heat.map(r),fire:g.fire,ext:g.ext,thr:g.thr,turb:r(g.turb),tips:g.tips,px:r(g.px),py:r(g.py),pz:r(g.pz),t:r(g.t),storm:g.storm,pax:g.pax.map(p=>({s:p.s,a:r(p.a),w:p.w,x:r(p.x),z:r(p.z),e:p.e}))}})}
 if(g.prog>=1)end(true,'ถึงจุดหมายปลายทางอย่างปลอดภัย ขอบคุณที่เลือกสายการบินมรณะ!');
